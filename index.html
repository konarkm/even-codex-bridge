<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Even Codex Bridge</title>
    <style>
      :root {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      body {
        margin: 0;
        padding: 16px;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }

      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px;
      }

      .row {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 12px;
        font-weight: 600;
        color: #334155;
      }

      input {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 13px;
      }

      button {
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        border-radius: 8px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .toolbar {
        display: flex;
        gap: 8px;
      }

      #status {
        font-size: 13px;
        color: #1d4ed8;
      }

      #logs {
        margin: 0;
        white-space: pre-wrap;
        font-size: 12px;
        color: #334155;
        max-height: 320px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card row">
        <h1>Codex Assistant (Even G2)</h1>
        <p>Speak to the glasses mic (STT) or submit text manually. Replies stream from Codex.</p>
      </section>

      <section class="card row">
        <label for="ws-url">Backend WebSocket URL (cloudflared or LAN)</label>
        <input id="ws-url" placeholder="wss://your-tunnel.trycloudflare.com/ws" />

        <label for="token">Shared Client Token</label>
        <input id="token" type="password" placeholder="same value as CLIENT_SHARED_TOKEN" />

        <div class="toolbar">
          <button id="connect-btn">Start Assistant</button>
          <button id="disconnect-btn" disabled>Stop Assistant</button>
          <button id="mic-toggle-btn" disabled>Mute Mic</button>
        </div>
      </section>

      <section class="card row">
        <label for="manual-text">Manual Text Prompt (fallback)</label>
        <input id="manual-text" placeholder="Ask Codex something..." />
        <div class="toolbar">
          <button id="submit-btn" disabled>Send Text</button>
        </div>
      </section>

      <section class="card row">
        <strong>Status</strong>
        <div id="status">Ready</div>
      </section>

      <section class="card row">
        <strong>Logs</strong>
        <pre id="logs"></pre>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
